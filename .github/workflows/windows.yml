name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build with the existing Windows compiler
        shell: pwsh
        run: ./scripts/build.ps1 -Native
      - name: Validate translations and source
        run: python scripts/validate.py
      - name: Package portable app and clean source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: slaves-encourager-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
