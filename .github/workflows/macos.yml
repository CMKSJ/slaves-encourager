name: macOS
on:
  push:
    branches: ['macos/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime: osx-arm64
          - runner: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate shared translations and extension
        run: |
          python3 scripts/validate.py
          node tests/extension.test.js
      - name: Build and verify native macOS bundle
        run: python3 scripts/build-macos.py --runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.runtime }}
          path: |
            dist/macos/${{ matrix.runtime }}/*.dmg
            dist/macos/${{ matrix.runtime }}/*.zip
            dist/macos/${{ matrix.runtime }}/manifest.json
            .build/macos-preview/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 14
